<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech to Text</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>🎤 Speech to Text</h2>
    <div id="output">Speak here...</div>
    <button class="start" onclick="startSpeech()">Start</button>
    <button class="stop" onclick="stopSpeech()">Stop</button>
    <button class="add" onclick="addToList()">Add</button>
    <ul id="list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
